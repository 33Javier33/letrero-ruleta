name: Build Apps (Windows + Android)

on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

concurrency:
  group: build-apps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Windows .exe via Electron ───────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: npm install
        working-directory: electron-app

      - name: Copy web files into Electron bundle
        shell: pwsh
        run: |
          $webDir = "electron-app\bundled-web"
          New-Item -ItemType Directory -Force -Path "$webDir\operador" | Out-Null
          $files = @("index.html","index2.html","sw.js","manifest.json","version.json",
                     "dreams-logo.png","roulette-pie.png","casino-bg.jpg",
                     "chile-flag.jpg","chile-flag-wood.jpg","wc26-logo.jpg",
                     "wc26-ball.jpg","chile18-bg.jpg","roulette-3d.jpg",
                     "roulette-pie.jpg","roulette-table.jpg")
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f "$webDir\" }
          }
          Copy-Item "operador\*" "$webDir\operador\" -Recurse

      - name: Build Windows installer
        run: npm run build
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            electron-app/dist/LetreroRuleta-Setup.exe
            electron-app/dist/LetreroRuleta-Portable.exe
          retention-days: 30

  # ── Android APK ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Copy web files into Android assets
        run: |
          WEB="android-app/app/src/main/assets/web"
          mkdir -p "$WEB/operador"
          for f in index.html index2.html sw.js manifest.json version.json \
                   dreams-logo.png roulette-pie.png casino-bg.jpg \
                   chile-flag.jpg chile-flag-wood.jpg wc26-logo.jpg \
                   wc26-ball.jpg chile18-bg.jpg roulette-3d.jpg \
                   roulette-pie.jpg roulette-table.jpg; do
            [ -f "$f" ] && cp "$f" "$WEB/"
          done
          cp -r operador/. "$WEB/operador/"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android-app

      - name: Rename APK
        run: |
          mv android-app/app/build/outputs/apk/debug/app-debug.apk \
             android-app/app/build/outputs/apk/debug/letrero-ruleta.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/app/build/outputs/apk/debug/letrero-ruleta.apk
          retention-days: 30

  # ── Publica el Release (links fijos en releases/latest/download/...) ────────
  release:
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "v=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.${{ steps.ver.outputs.v }}.0
          commit: ${{ github.sha }}
          name: Letrero Ruleta v${{ steps.ver.outputs.v }}
          body: "Descargas: Windows (Setup / Portable) y Android (APK). Funcionan sin internet y se actualizan solas."
          artifacts: "release/**/*.exe,release/**/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
