    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        /* --s = container width (fits 9:16 into any screen) | --u = 1 design-px */
        :root { --s: min(100vw, calc(56.25 * var(--vh, 1vh))); --u: calc(var(--s) / 540); }

        .screen-container {

            background-size:300px 300px;

        .logo-area img { width:82%; max-width:calc(var(--u)*240); height:auto; display:block; margin:0 auto; }

        /* RULETA */
        .wheel-wrapper { width:calc(var(--u)*280); height:calc(var(--u)*280); margin-bottom:calc(var(--u)*4); position:relative; flex-shrink:0; }

        .current-number-display.num-green { background-color:#006600!important; color:#fff!important; border-color:#33ff33; }

        @keyframes logoPulse {
            0%   { transform:scale(1) rotate(0deg); }

        .logo-pulse { animation:logoPulse 1.4s ease-in-out !important; transform-origin:center center; }

        /* TITLE SHINE ANIMATION */
        @keyframes titleShine {

<div class="screen-container" id="screenContainer">

    <div class="top-section">

var numberColors={'0':'green','00':'green','1':'red','2':'black','3':'red','4':'black','5':'red','6':'black','7':'red','8':'black','9':'red','10':'black','11':'black','12':'red','13':'black','14':'red','15':'black','16':'red','17':'black','18':'red','19':'red','20':'black','21':'red','22':'black','23':'red','24':'black','25':'red','26':'black','27':'red','28':'black','29':'black','30':'red','31':'black','32':'red','33':'black','34':'red','35':'black','36':'red'};

function drawWheel(canvas,angle,o){
    var ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,total=WHEEL_ORDER.length,slice=(2*Math.PI)/total;
    ctx.clearRect(0,0,W,H);
    ctx.beginPath();ctx.arc(cx,cy,o.ob,0,2*Math.PI);
    var g=ctx.createRadialGradient(cx,cy,o.ob*.85,cx,cy,o.ob);
    g.addColorStop(0,'#c8930a');g.addColorStop(.4,'#f0c040');g.addColorStop(.7,'#d4a017');g.addColorStop(1,'#8a6000');
    ctx.fillStyle=g;ctx.fill();
    if(o.diamonds){[0,Math.PI/2,Math.PI,3*Math.PI/2].forEach(function(a){var dx=cx+o.ob*.93*Math.cos(a-Math.PI/2),dy=cy+o.ob*.93*Math.sin(a-Math.PI/2),ds=o.ob*.07;ctx.save();ctx.translate(dx,dy);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,-ds);ctx.lineTo(ds*.5,0);ctx.lineTo(0,ds);ctx.lineTo(-ds*.5,0);ctx.closePath();ctx.fillStyle='#fff8dc';ctx.fill();ctx.strokeStyle='#a07010';ctx.lineWidth=.5;ctx.stroke();ctx.restore();});}
    ctx.beginPath();ctx.arc(cx,cy,o.or,0,2*Math.PI);ctx.fillStyle='#0a0a0a';ctx.fill();
    for(var i=0;i<total;i++){var s=angle+i*slice-slice/2,e=s+slice,col=numberColors[WHEEL_ORDER[i]];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,o.no,s,e);ctx.closePath();ctx.fillStyle=col==='green'?'#006600':col==='red'?'#cc0000':'#111';ctx.fill();ctx.beginPath();ctx.moveTo(cx+o.ni*Math.cos(s),cy+o.ni*Math.sin(s));ctx.lineTo(cx+o.no*Math.cos(s),cy+o.no*Math.sin(s));ctx.strokeStyle='rgba(180,140,0,0.7)';ctx.lineWidth=.8;ctx.stroke();}
    ctx.beginPath();ctx.arc(cx,cy,o.ii,0,2*Math.PI);var g2=ctx.createRadialGradient(cx,cy,o.ii*.7,cx,cy,o.ii);g2.addColorStop(0,'#8a6000');g2.addColorStop(.5,'#d4a017');g2.addColorStop(1,'#f0c040');ctx.fillStyle=g2;ctx.fill();
    for(var j=0;j<total;j++){var mid=angle+j*slice,tr=(o.no+o.ni)/2;ctx.save();ctx.translate(cx+tr*Math.cos(mid),cy+tr*Math.sin(mid));ctx.rotate(mid+Math.PI/2);ctx.font='bold '+o.fs+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=2;ctx.fillText(WHEEL_ORDER[j],0,0);ctx.restore();}
    ctx.beginPath();ctx.arc(cx,cy,o.ii*.98,0,2*Math.PI);var cg=ctx.createRadialGradient(cx,cy,0,cx,cy,o.ii);cg.addColorStop(0,'#1a1a1a');cg.addColorStop(1,'#050505');ctx.fillStyle=cg;ctx.fill();
    [0,Math.PI/2,Math.PI,3*Math.PI/2].forEach(function(a){ctx.save();ctx.translate(cx,cy);ctx.rotate(a+angle*.3);ctx.beginPath();ctx.moveTo(0,o.hr*.5);ctx.lineTo(0,o.ii*.85);ctx.lineWidth=o.aw;ctx.strokeStyle='#f0c040';ctx.lineCap='round';ctx.stroke();ctx.beginPath();ctx.arc(0,-o.ii*.82,o.br,0,2*Math.PI);ctx.fillStyle='#f0c040';ctx.fill();ctx.restore();});
    ctx.beginPath();ctx.arc(cx,cy,o.hr,0,2*Math.PI);var hg=ctx.createRadialGradient(cx-o.hr*.3,cy-o.hr*.3,o.hr*.1,cx,cy,o.hr);hg.addColorStop(0,'#f0c040');hg.addColorStop(.6,'#c8930a');hg.addColorStop(1,'#7a5500');ctx.fillStyle=hg;ctx.fill();ctx.strokeStyle='#f0c040';ctx.lineWidth=1;ctx.stroke();
}

var wA=0;
var mO={ob:72,or:68,no:65,ni:47,ii:43,hr:10,fs:7,aw:3.5,br:3.5,diamonds:true};
// ---- BALL SPIN ANIMATION ----
var ballAnim={
    active:false, phase:'idle',
    bAngle:0, bSpeed:0, bR:0, bDecay:0.987,
    wTarget:0, timer:0, pendingData:null,
    TARGET_ANGLE:-Math.PI/2,
    restOffset:0
};

function drawBallOnCanvas(canvas){
    if(ballAnim.phase==='idle')return;
    if(localStorage.getItem('rlt_ballspin')!=='1'){ballAnim.phase='idle';ballAnim.active=false;return;}
    var ctx=canvas.getContext('2d'),W=canvas.width,cx=W/2,cy=W/2;
    if(ballAnim.phase==='rest'){ballAnim.bR=mO.no*1.02;ballAnim.bAngle=ballAnim.restOffset+wA;}
    var bx=cx+ballAnim.bR*Math.cos(ballAnim.bAngle);
    var by=cy+ballAnim.bR*Math.sin(ballAnim.bAngle);
    var br=mO.ob*0.065;
    ctx.save();
    ctx.beginPath();ctx.arc(bx+br*.4,by+br*.4,br*.9,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.32)';ctx.fill();
    var g=ctx.createRadialGradient(bx-br*.35,by-br*.4,br*.05,bx,by,br);
    g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#e0e0e0');g.addColorStop(1,'#888');
    ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=.5;ctx.stroke();
    ctx.restore();
}

function tickBall(){
    var slice=(2*Math.PI)/WHEEL_ORDER.length;
    if(ballAnim.phase==='spin'){
        var remaining=ballAnim.wTarget-wA;
        if(remaining>3*Math.PI){wA+=0.055;}
        else{wA+=Math.max(0.008,0.055*(remaining/(3*Math.PI)));}
        ballAnim.bAngle-=ballAnim.bSpeed;
        ballAnim.bSpeed*=ballAnim.bDecay;
        ballAnim.timer++;
        if(ballAnim.bSpeed<0.028||(ballAnim.wTarget-wA)<0.4){
            wA=ballAnim.wTarget;
            ballAnim.bSpeed=0;
            ballAnim.phase='settle';
            ballAnim.timer=0;
        }
    }else if(ballAnim.phase==='settle'){
        var pocketR=(mO.no+mO.ni)/2;
        ballAnim.bR+=(pocketR-ballAnim.bR)*0.07;
        var diff=ballAnim.TARGET_ANGLE-ballAnim.bAngle;
        while(diff>Math.PI)diff-=2*Math.PI;
        while(diff<-Math.PI)diff+=2*Math.PI;
        ballAnim.bAngle+=diff*0.09;
        ballAnim.timer++;
        if(ballAnim.timer>60&&Math.abs(pocketR-ballAnim.bR)<1.2){
            ballAnim.phase='reveal';ballAnim.timer=0;
        }
    }else if(ballAnim.phase==='reveal'){
        ballAnim.bR+=(mO.no*1.02-ballAnim.bR)*0.04;
        ballAnim.timer++;
        if(ballAnim.timer===1&&ballAnim.pendingData){
            updateScreen(ballAnim.pendingData);
            if(elN){elN.classList.add('num-reveal');setTimeout(function(){if(elN)elN.classList.remove('num-reveal');},800);}
            ballAnim.pendingData=null;
        }
        if(ballAnim.timer>100){ballAnim.restOffset=ballAnim.TARGET_ANGLE-wA;ballAnim.phase='rest';ballAnim.active=false;}
    }
}

function spinToNumber(data){
    if(localStorage.getItem('rlt_ballspin')!=='1'||ballAnim.active||!data.history.length){updateScreen(data);return;}
    var last=data.history[data.history.length-1];
    var idx=WHEEL_ORDER.indexOf(last);
    if(idx===-1){updateScreen(data);return;}
    var slice=(2*Math.PI)/WHEEL_ORDER.length;
    var raw=-Math.PI/2-idx*slice;
    var wTarget=raw;
    while(wTarget<wA+5*Math.PI*2)wTarget+=Math.PI*2;
    ballAnim.active=true;
    ballAnim.phase='spin';
    ballAnim.bAngle=Math.PI/2;
    ballAnim.bSpeed=0.19;
    ballAnim.bR=mO.or*0.97;
    ballAnim.wTarget=wTarget;
    ballAnim.timer=0;
    ballAnim.pendingData=data;
}

function animW(){
    tickBall();
    if(ballAnim.phase==='idle'||ballAnim.phase==='rest')wA+=.008;
    var c=document.getElementById('wheelCanvas');
    drawWheel(c,wA,mO);
    drawBallOnCanvas(c);
    requestAnimationFrame(animW);
}

var MAX_H=12,LS='ruleta_casino_data',lastD='';
var elN,elB,h1,h2,h3,c1,c2,c3,elT,eMP,eMxP,eMD,eMxD,eMS,eMxS;

function sT(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
function sW(id,v){var e=document.getElementById(id);if(e)e.style.width=v+'%';}

function calcStats(h){
    if(!h.length)return{pctRed:0,pctBlack:0,pctGreen:0,pctPar:0,pctImpar:0,pctMenor:0,pctMayor:0,pctD1:0,pctD2:0,pctD3:0,hot:['36','35','34'],cold:['0','00','1']};
    var counts={},rC=0,bC=0,gC=0,pC=0,iC=0,menC=0,mayC=0,d1=0,d2=0,d3=0;
    Object.keys(numberColors).forEach(function(n){counts[n]=0;});
    h.forEach(function(num){
        if(counts[num]===undefined)return;
        counts[num]++;
        var col=numberColors[num];
        if(col==='red')rC++;else if(col==='black')bC++;else gC++;
        var n=parseInt(num);
        if(!isNaN(n)&&n>=1&&n<=36){if(n%2===0)pC++;else iC++;if(n<=18)menC++;else mayC++;if(n<=12)d1++;else if(n<=24)d2++;else d3++;}
    });
    var t=h.length,v=pC+iC;
    var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
    return{pctRed:Math.round(rC/t*100),pctBlack:Math.round(bC/t*100),pctGreen:Math.round(gC/t*100),
        pctPar:t?Math.round(pC/t*100):0,pctImpar:t?Math.round(iC/t*100):0,
        pctMenor:t?Math.round(menC/t*100):0,pctMayor:t?Math.round(mayC/t*100):0,
        pctD1:v?Math.round(d1/v*100):0,pctD2:v?Math.round(d2/v*100):0,pctD3:v?Math.round(d3/v*100):0,
        hot:sorted.slice(0,3),cold:sorted.slice().reverse().slice(0,3)};
}

function updateScreen(data){
    var iW=document.getElementById('history-items');
    iW.innerHTML='';
    var nums=data.history.slice().reverse().slice(0,MAX_H);
    var bp=localStorage.getItem('rlt_ballpizarra')==='1';
    var brd=document.getElementById('history-board');if(brd)brd.classList.toggle('ball-mode',bp);
    var bpCount=bp?12:MAX_H;
    for(var i=0;i<bpCount;i++){
        var d=document.createElement('div');d.className='history-item';
        if(i<nums.length){
            var num=nums[i];var c=numberColors[num];
            d.classList.add(c==='red'?'color-red':c==='black'?'color-black':'color-green');
            if(bp){var s=document.createElement('span');s.className='ball-circle';s.textContent=num;if(i===0&&localStorage.getItem('rlt_fx_entry')!=='0')s.classList.add('ball-new');d.appendChild(s);}
            else{d.textContent=num;}
        }
        iW.appendChild(d);
    }
    if(data.history.length){
        var last=data.history[data.history.length-1];elN.textContent=last;
        elN.className='current-number-display';
        var cc=numberColors[last];
        if(cc==='red')elN.classList.add('num-red');else if(cc==='black')elN.classList.add('num-black');else elN.classList.add('num-green');
    }else{elN.textContent='-';elN.className='current-number-display';}
    var s=calcStats(data.history);
    sT('txt-pct-red',s.pctRed+'%');sW('bar-red',s.pctRed);
    sT('txt-pct-green',s.pctGreen+'%');sW('bar-green',s.pctGreen);
    sT('txt-pct-black',s.pctBlack+'%');sW('bar-black',s.pctBlack);
    sT('txt-pct-par',s.pctPar+'%');sW('bar-par',s.pctPar);
    sT('txt-pct-pi-green',s.pctGreen+'%');sW('bar-pi-green',s.pctGreen);
    sT('txt-pct-impar',s.pctImpar+'%');sW('bar-impar',s.pctImpar);
    sT('txt-pct-menor',s.pctMenor+'%');sW('bar-menor',s.pctMenor);
    sT('txt-pct-mm-green',s.pctGreen+'%');sW('bar-mm-green',s.pctGreen);
    sT('txt-pct-mayor',s.pctMayor+'%');sW('bar-mayor',s.pctMayor);
    sT('txt-pct-d1',s.pctD1+'%');sW('bar-d1',s.pctD1);
    sT('txt-pct-d2',s.pctD2+'%');sW('bar-d2',s.pctD2);
    sT('txt-pct-d3',s.pctD3+'%');sW('bar-d3',s.pctD3);
    h1.textContent=s.hot[0];h2.textContent=s.hot[1];h3.textContent=s.hot[2];
    c1.textContent=s.cold[0];c2.textContent=s.cold[1];c3.textContent=s.cold[2];
    var lim=data.limits;
    eMP.textContent=lim.minPleno;eMxP.textContent=lim.maxPleno;
    eMD.textContent=lim.minDobles;eMxD.textContent=lim.maxDobles;
    eMS.textContent=lim.minSimples;eMxS.textContent=lim.maxSimples;
}

function checkStorage(){var r=localStorage.getItem(LS);if(r&&r!==lastD){lastD=r;try{var d=JSON.parse(r);if(d.history&&d.history.length&&localStorage.getItem('rlt_ballspin')==='1'&&!ballAnim.active){spinToNumber(d);}else{updateScreen(d);}}catch(e){}}}
window.addEventListener('storage',function(e){if(e.key===LS)checkStorage();if(e.key==='rlt_ballpizarra'){lastD=null;checkStorage();}});

window.onload=function(){
    resizeCanvas();
    var tl=document.getElementById('tableLogoImg'),ml=document.getElementById('logoImg');if(tl&&ml)tl.src=ml.src;
    elN=document.getElementById('display-current-number');
    elB=document.getElementById('history-board');
    h1=document.getElementById('hot-1');h2=document.getElementById('hot-2');h3=document.getElementById('hot-3');
    c1=document.getElementById('cold-1');c2=document.getElementById('cold-2');c3=document.getElementById('cold-3');
    elT=document.getElementById('titulo-ruleta');
    eMP=document.getElementById('display-min-pleno');eMxP=document.getElementById('display-max-pleno');
    eMD=document.getElementById('display-min-dobles');eMxD=document.getElementById('display-max-dobles');
    eMS=document.getElementById('display-min-simples');eMxS=document.getElementById('display-max-simples');
    var brdInit=document.getElementById('history-board');if(brdInit)brdInit.classList.toggle('ball-mode',localStorage.getItem('rlt_ballpizarra')==='1');
    if(!localStorage.getItem(LS))localStorage.setItem(LS,JSON.stringify({history:[],limits:{minPleno:'$1.000',maxPleno:'$20.000',minDobles:'$10.000',maxDobles:'$350.000',minSimples:'$20.000',maxSimples:'$700.000'}}));
    var nom=localStorage.getItem('ruleta_nombre');if(nom&&elT)elT.textContent=nom;
    window.addEventListener('storage',function(e){if(e.key==='ruleta_nombre'&&elT)elT.textContent=e.newValue;});
    checkStorage();setInterval(checkStorage,300);
    animW();
    // Apply saved pizarra theme
    (function(){var k=localStorage.getItem('rlt_pizarra_theme');if(k&&k!=='negro'){var b=document.getElementById('history-board');if(b)b.classList.add('pizarra-'+k);}})();
    // Apply saved limits theme
    (function(){var k=localStorage.getItem('rlt_lim_theme');if(k&&k!=='azul'){var c=document.querySelector('.limits-table-container');if(c)c.classList.add('lim-'+k);}})();
    // Logo pulse every 9s
    setInterval(function(){var lg=document.getElementById('tableLogoImg');if(lg){lg.classList.add('logo-pulse');setTimeout(function(){lg.classList.remove('logo-pulse');},1400);}},9000);
    // Title shine every 14s
    setInterval(function(){var tt=document.getElementById('titulo-ruleta');if(tt){tt.classList.add('title-shine');setTimeout(function(){tt.classList.remove('title-shine');},2800);}},14000);
    // Ball glow every 30s
    setInterval(function(){
        if(localStorage.getItem('rlt_fx_glow')!=='1'||localStorage.getItem('rlt_ballpizarra')!=='1')return;
        var bc=document.querySelector('#history-items .ball-circle');
        if(!bc)return;
        bc.classList.remove('ball-glow-anim');void bc.offsetWidth;
        bc.classList.add('ball-glow-anim');
        setTimeout(function(){bc.classList.remove('ball-glow-anim');},2500);
    },30000);
    // Ball pulse every 8s
    setInterval(function(){
        if(localStorage.getItem('rlt_fx_pulse')!=='1'||localStorage.getItem('rlt_ballpizarra')!=='1')return;
        var bc=document.querySelector('#history-items .ball-circle');
        if(!bc)return;
        bc.classList.remove('ball-pulse-anim');void bc.offsetWidth;
        bc.classList.add('ball-pulse-anim');
        setTimeout(function(){bc.classList.remove('ball-pulse-anim');},700);
    },8000);
    var cp=0;
    function goPanel(i){
        var p=document.getElementById('panel-'+cp),d=document.getElementById('dot-'+cp);
        if(p)p.classList.remove('active');if(d)d.classList.remove('active');
        cp=i%4;
        var np=document.getElementById('panel-'+cp),nd=document.getElementById('dot-'+cp);
        if(np)np.classList.add('active');if(nd)nd.classList.add('active');
    }
    setInterval(function(){goPanel(cp+1);},15000);
    if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js',{scope:'/'});}
};
</script>
